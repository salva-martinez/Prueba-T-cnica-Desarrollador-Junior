; Ajustes de PHP para la aplicación de Reservas.
;
; Mitigaciones que recomienda php.net para los CVE-2026-109618 y
; CVE-2026-109619 (RCE sin autenticar, CVSS v4.0 9.2, publicados el
; 21/10/2026). Son medidas de reducción de exposición: la solución completa
; es tener PHP actualizado (8.5.12 en el Dockerfile).
;
; Aviso: https://www.php.net/archive/2026.php#2026-10-21-5

[PHP]

; CVE-2026-109618: sin un límite finito de memoria no hay fallo de memoria
; controlado por el atacante, que es lo que dispara la ruta vulnerable. El
; límite del contenedor (mem_limit en compose.yaml) es la frontera de
; disponibilidad que el aviso pide.
memory_limit = -1

; La aplicación no usa sesiones: la carga de progreso de sesión es una de las
; rutas confirmadas del CVE-2026-109619.
session.upload_progress.enabled = 0

; En PHP 8.5 el backtrace de los errores fatales es otra ruta confirmada del
; mismo CVE.
fatal_error_backtraces = 0

; La aplicación no sube ficheros: requests pequeños.
post_max_size = 8M
upload_max_filesize = 2M

; ---------------------------------------------------------------------------
; Los errores NUNCA deben llegar al cliente.
;
; La imagen oficial de PHP no trae php.ini, así que display_errors venía en On
; y cualquier aviso (por ejemplo, "curl_close() is deprecated" en PHP 8.5) se
; imprimía ANTES de la respuesta JSON. Eso rompía el parseo del frontend
; ("El servidor no ha devuelto una respuesta JSON válida") y además impedía
; fijar el código HTTP, porque las cabeceras ya se habían enviado.
;
; Con display_errors=Off los avisos van al log del contenedor (docker logs) y
; la respuesta sigue siendo JSON puro. error_reporting=E_ALL deja todo
; registrado para poder revisarlo.
; ---------------------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
